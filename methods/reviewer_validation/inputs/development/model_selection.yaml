screen_design:
  repetitions_per_model_paper_workflow: 2
  invocations_per_model: 8
  total_invocations: 16
  run_order_seed: 2026083001
  blind_label_seed: 2026083002
  blind_model_labels: [M1, M2]
  mapping_visibility: hidden_from_A_and_B_until_both_rating_files_are_locked
  same_prompt_excerpt_and_parameters_within_pair: true
  development_manifest: methods/reviewer_validation/inputs/development/manifest.yaml
  output_root: methods/reviewer_validation/outputs/pilot/model_selection

technical_eligibility:
  minimum_valid_invocations_per_model: 7
  total_invocations_per_model: 8
  require_at_least_one_valid_output_per_paper_workflow: true
  disqualifying_conditions:
    - any_cross_provider_or_cross_model_fallback
    - secret_material_in_artifacts
    - systematic_failure_of_either_workflow
    - missing_or_inconsistent_provider_reported_model
    - request_pair_diff_beyond_model_id_and_blind_order_metadata
  retained_failure_types:
    - empty_response
    - invalid_json
    - timeout
    - provider_error
    - legal_empty

human_rating:
  raters: [A, B]
  independent_before_adjudication: true
  paired_validity:
    both_model_outputs_must_be_valid: true
    invalid_one_sided_pair_treatment: retain_as_technical_failure_and_do_not_rate
    minimum_common_valid_pairs: 7
    total_pairs: 8
  dimensions:
    - evidence_grounding
    - substantive_coverage
    - unsupported_or_invented_content
    - classification_or_review_correctness
    - actionable_specificity
  dimension_scale: [0, 1, 2]
  dimension_rubric:
    evidence_grounding:
      direction: higher_is_better
      anchors: {0: no traceable support, 1: partly grounded or vague, 2: specific and traceably grounded}
    substantive_coverage:
      direction: higher_is_better
      anchors: {0: misses central issues, 1: partial coverage, 2: covers the central issues}
    unsupported_or_invented_content:
      direction: lower_is_better
      anchors: {0: none found, 1: minor unsupported content, 2: material unsupported or invented content}
    classification_or_review_correctness:
      direction: higher_is_better
      anchors: {0: materially incorrect, 1: mixed or partly correct, 2: substantively correct}
    actionable_specificity:
      direction: higher_is_better
      anchors: {0: not actionable, 1: partly actionable, 2: specific actionable guidance}
  pair_preference: [M1, tie, M2]
  source_boundary: model_visible_excerpt_only
  lock_rule: Each rater completes a separate file set; both file-set hashes lock before unblinding.
  preference_aggregation:
    same_non_tie: that_label_wins
    one_tie_one_non_tie: non_tie_label_wins
    opposite_non_tie: aggregate_tie
    both_tie: aggregate_tie

selection_rule:
  order:
    - Exclude a technically ineligible candidate; if both are ineligible, selection remains blocked.
    - Compare locked blind ratings only after both raters finish all pairs.
    - Prefer the candidate with more pairwise wins, provided its unsupported-content total is not higher.
    - If pairwise wins tie, prefer the candidate with the lower unsupported-content total.
    - If pairwise wins and unsupported-content totals both tie, select deepseek-v4-pro using the declared user preference prior.
    - If pairwise wins conflict with unsupported-content safety, selection remains blocked for adjudication rather than using cost as a tie-break.
  price_used_as_quality_tie_break: false
  formal_protocol_update_allowed_only_after_selection: true
  rerun_g1_with_selected_single_model: true
  multi_model_screen_counts_as_g1: false

