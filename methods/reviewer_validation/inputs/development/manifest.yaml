selection:
  strategy: purposive_maximum_variation
  selected_before_external_model_output: true
  purpose: Expose parser, excerpt, prompt, and codebook failures before any held-out work.
  inference_scope: pipeline_development_only
  criteria:
    - English open-access regular full paper with a verifiable formal record.
    - Complementary research paradigms and evidence structures.
    - Different target venues and domains.
    - Multi-column layouts that exercise the current product parser.
    - Sufficient claims, methods, results, limitations, and references for both Ledger and Reviewer pilots.
  rationale: >-
    The ICML paper is quantitative causal-method research with semi-synthetic and
    real-world experiments; the CHI paper is qualitative, value-sensitive design
    research based on interviews with 20 science journalists. Their methodological
    and rhetorical differences make them suitable development stress cases, not a
    representative or inferential sample.
  held_out_selection_unchanged: seeded_stratified_sampling_from_complete_candidate_frame

preparation:
